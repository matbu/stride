<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrackClub</title>

    <meta
        name="description"
        content="TrackClub is a coaching application designed for athletic and football clubs."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 24px;
            padding: 56px 40px;

            text-align: center;

            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;
            background: #111827;
            color: white;

            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 42px;
            letter-spacing: -1px;
        }

        .tagline {
            margin: 0 auto 24px;
            max-width: 520px;

            font-size: 19px;
            line-height: 1.6;
            color: #4b5563;
        }

        .description {
            margin: 0 auto 36px;
            max-width: 560px;

            font-size: 16px;
            line-height: 1.7;
            color: #6b7280;
        }

        .button {
            display: inline-block;
            padding: 13px 24px;

            border-radius: 10px;
            background: #111827;
            color: white;

            text-decoration: none;
            font-weight: 600;

            transition: opacity 0.2s ease;
        }

        .button:hover {
            opacity: 0.85;
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: #9ca3af;
        }

        footer a {
            color: #6b7280;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 34px;
            }

            .tagline {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">TC</div>

        <h1>TrackClub</h1>

        <p class="tagline">
            Coaching made simple for athletic and football clubs.
        </p>

        <p class="description">
            TrackClub is a coaching application designed for sports clubs
            and their coaching teams. It helps coaches organize, manage
            and support the training of their athletes and players.
        </p>

        <a class="button" href="docs/privacy-policy.html">
            Privacy Policy
        </a>

        <footer>
            &copy; 2026 TrackClub
        </footer>
    </main>
</body>
</html>
